<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POP! Calculadora</title>
<meta name="description" content="Calculadora con estilo pop art: cómic, halftone y colores vibrantes.">
<meta name="theme-color" content="#FF2E93">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root{
    --ink:#171308;
    --paper:#FFF8E7;
    --magenta:#FF2E93;
    --magenta-ink:#5c0030;
    --yellow:#FFD600;
    --yellow-ink:#5c4600;
    --cyan:#00C2D1;
    --cyan-ink:#003a3f;
    --bg-1:#F5C6E0;
    --bg-2:#BFE8F0;
    --panel:#FFFDF7;
    --shadow-hard: var(--ink);
    --dot-color: rgba(23,19,8,0.16);
    --screen-bg:#171308;
    --screen-text:#FFD600;
    --screen-sub:#ff9fce;
  }
  :root[data-theme="dark"]{
    --ink:#F5F0E4;
    --paper:#120A1C;
    --magenta:#FF57A8;
    --magenta-ink:#3a0022;
    --yellow:#FFE066;
    --yellow-ink:#3a2c00;
    --cyan:#3EE6F2;
    --cyan-ink:#00292c;
    --bg-1:#2A0E2E;
    --bg-2:#0E1E3A;
    --panel:#1B1026;
    --dot-color: rgba(245,240,228,0.10);
    --screen-bg:#050208;
    --screen-text:#FFE066;
    --screen-sub:#ff9fce;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#F5F0E4;
      --paper:#120A1C;
      --magenta:#FF57A8;
      --magenta-ink:#3a0022;
      --yellow:#FFE066;
      --yellow-ink:#3a2c00;
      --cyan:#3EE6F2;
      --cyan-ink:#00292c;
      --bg-1:#2A0E2E;
      --bg-2:#0E1E3A;
      --panel:#1B1026;
      --dot-color: rgba(245,240,228,0.10);
      --screen-bg:#050208;
      --screen-text:#FFE066;
      --screen-sub:#ff9fce;
    }
  }

  *{box-sizing:border-box;}

  html, body{ height:100%; }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
    background:
      radial-gradient(circle at 8px 8px, var(--dot-color) 2.2px, transparent 2.3px) 0 0/24px 24px,
      linear-gradient(135deg, var(--bg-1), var(--bg-2));
    font-family: "Segoe UI", ui-sans-serif, system-ui, -apple-system, sans-serif;
    color: var(--ink);
  }

  .stage{
    width:100%;
    max-width:380px;
  }

  .brand{
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:10px;
    margin-bottom:18px;
    transform: rotate(-2deg);
  }
  .brand .pop{
    font-family: Georgia, "Times New Roman", serif;
    font-weight:900;
    font-style:italic;
    font-size:2.6rem;
    letter-spacing:1px;
    color: var(--magenta);
    -webkit-text-stroke: 2px var(--ink);
    text-shadow: 4px 4px 0 var(--ink);
  }
  .brand .sub{
    font-weight:800;
    font-size:0.95rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color: var(--ink);
    opacity:0.75;
  }

  .calc{
    position:relative;
    background: var(--panel);
    border:5px solid var(--ink);
    border-radius:26px;
    padding:18px;
    box-shadow: 10px 10px 0 var(--shadow-hard);
  }

  .burst{
    position:absolute;
    top:-22px;
    right:-18px;
    width:64px;
    height:64px;
    background: var(--yellow);
    border:4px solid var(--ink);
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    font-style:italic;
    font-size:0.62rem;
    letter-spacing:0.02em;
    color:var(--yellow-ink);
    transform: rotate(8deg);
    transition: transform 0.15s ease;
  }
  .burst.hit{ transform: rotate(8deg) scale(1.18); }

  .screen{
    background: var(--screen-bg);
    border:4px solid var(--ink);
    border-radius:16px;
    padding:18px 20px 14px;
    margin-bottom:16px;
    text-align:right;
    overflow:hidden;
  }
  .screen .history{
    min-height:1.1rem;
    font-size:0.9rem;
    font-weight:700;
    letter-spacing:0.02em;
    color: var(--screen-sub);
    font-variant-numeric: tabular-nums;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    opacity:0.9;
  }
  .screen .current{
    font-size:2.6rem;
    font-weight:800;
    color: var(--screen-text);
    font-variant-numeric: tabular-nums;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    line-height:1.15;
    text-shadow: 0 0 12px color-mix(in srgb, var(--screen-text) 45%, transparent);
  }

  .pad{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap:10px;
  }

  button.key{
    appearance:none;
    border:3px solid var(--ink);
    border-radius:14px;
    padding:16px 0;
    font-size:1.15rem;
    font-weight:800;
    font-family: inherit;
    cursor:pointer;
    background: var(--paper);
    color: var(--ink);
    box-shadow: 4px 4px 0 var(--ink);
    transition: transform 0.06s ease, box-shadow 0.06s ease;
  }
  button.key:hover{ filter:brightness(1.03); }
  button.key:active,
  button.key.pressed{
    transform: translate(4px,4px);
    box-shadow: 0 0 0 var(--ink);
  }
  button.key:focus-visible{
    outline:3px solid var(--cyan);
    outline-offset:2px;
  }

  .key.op{ background: var(--magenta); color: var(--paper); }
  .key.fn{ background: var(--cyan); color: var(--cyan-ink); }
  .key.zero{ grid-column: span 2; }
  .key.equals{
    background: var(--yellow);
    color: var(--yellow-ink);
    font-size:1.4rem;
  }

  .credit{
    text-align:center;
    margin-top:16px;
    font-size:0.72rem;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color: var(--ink);
    opacity:0.55;
  }

  @media (prefers-reduced-motion: reduce){
    button.key, .burst{ transition:none; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="brand">
    <span class="pop">POP!</span>
    <span class="sub">Calculadora</span>
  </div>

  <div class="calc">
    <div class="burst" id="burst">BAM</div>

    <div class="screen">
      <div class="history" id="history">&nbsp;</div>
      <div class="current" id="current">0</div>
    </div>

    <div class="pad" id="pad">
      <button class="key fn" data-action="clear">AC</button>
      <button class="key fn" data-action="sign">+/&minus;</button>
      <button class="key fn" data-action="percent">%</button>
      <button class="key op" data-action="op" data-op="÷">÷</button>

      <button class="key" data-action="digit" data-digit="7">7</button>
      <button class="key" data-action="digit" data-digit="8">8</button>
      <button class="key" data-action="digit" data-digit="9">9</button>
      <button class="key op" data-action="op" data-op="×">×</button>

      <button class="key" data-action="digit" data-digit="4">4</button>
      <button class="key" data-action="digit" data-digit="5">5</button>
      <button class="key" data-action="digit" data-digit="6">6</button>
      <button class="key op" data-action="op" data-op="−">−</button>

      <button class="key" data-action="digit" data-digit="1">1</button>
      <button class="key" data-action="digit" data-digit="2">2</button>
      <button class="key" data-action="digit" data-digit="3">3</button>
      <button class="key op" data-action="op" data-op="+">+</button>

      <button class="key zero" data-action="digit" data-digit="0">0</button>
      <button class="key" data-action="decimal">.</button>
      <button class="key equals" data-action="equals">=</button>
    </div>
  </div>

  <div class="credit">chispa &middot; color &middot; matemática</div>
</div>

<script>
(function(){
  var currentEl = document.getElementById('current');
  var historyEl = document.getElementById('history');
  var burst = document.getElementById('burst');

  var state = {
    current: '0',
    previous: null,
    operator: null,
    overwrite: true
  };

  function formatNumber(n){
    if (!isFinite(n)) return 'Error';
    var s = n.toString();
    if (s.length > 12) {
      s = parseFloat(n.toPrecision(10)).toString();
    }
    return s;
  }

  function render(){
    currentEl.textContent = state.current;
    if (state.operator && state.previous !== null){
      historyEl.textContent = state.previous + ' ' + state.operator;
    } else {
      historyEl.textContent = ' ';
    }
  }

  function inputDigit(d){
    if (state.overwrite){
      state.current = (d === '0') ? '0' : d;
      state.overwrite = false;
    } else {
      if (state.current === '0' && d !== '0'){
        state.current = d;
      } else if (state.current.replace('-','').replace('.','').length < 12) {
        state.current += d;
      }
    }
  }

  function inputDecimal(){
    if (state.overwrite){
      state.current = '0.';
      state.overwrite = false;
      return;
    }
    if (state.current.indexOf('.') === -1){
      state.current += '.';
    }
  }

  function toggleSign(){
    if (state.current === '0') return;
    state.current = state.current.charAt(0) === '-' ? state.current.slice(1) : '-' + state.current;
  }

  function toPercent(){
    var val = parseFloat(state.current) / 100;
    state.current = formatNumber(val);
    state.overwrite = true;
  }

  function compute(a, b, op){
    switch(op){
      case '+': return a + b;
      case '−': return a - b;
      case '×': return a * b;
      case '÷': return b === 0 ? NaN : a / b;
      default: return b;
    }
  }

  function chooseOperator(op){
    if (state.operator && !state.overwrite){
      equals();
    }
    state.previous = state.current;
    state.operator = op;
    state.overwrite = true;
  }

  function equals(){
    if (state.operator === null || state.previous === null) return;
    var a = parseFloat(state.previous);
    var b = parseFloat(state.current);
    var result = compute(a, b, state.operator);
    state.current = formatNumber(result);
    state.previous = null;
    state.operator = null;
    state.overwrite = true;
    pop();
  }

  function clearAll(){
    state.current = '0';
    state.previous = null;
    state.operator = null;
    state.overwrite = true;
  }

  function backspace(){
    if (state.overwrite) return;
    if (state.current.length <= 1 || (state.current.length === 2 && state.current.charAt(0) === '-')){
      state.current = '0';
      state.overwrite = true;
    } else {
      state.current = state.current.slice(0, -1);
    }
  }

  function pop(){
    burst.classList.remove('hit');
    void burst.offsetWidth;
    burst.classList.add('hit');
  }

  document.getElementById('pad').addEventListener('click', function(e){
    var btn = e.target.closest('button.key');
    if (!btn) return;
    var action = btn.dataset.action;
    if (action === 'digit') inputDigit(btn.dataset.digit);
    else if (action === 'decimal') inputDecimal();
    else if (action === 'sign') toggleSign();
    else if (action === 'percent') toPercent();
    else if (action === 'op') chooseOperator(btn.dataset.op);
    else if (action === 'equals') equals();
    else if (action === 'clear') clearAll();
    render();
  });

  window.addEventListener('keydown', function(e){
    var key = e.key;
    var btn = null;
    if (/^[0-9]$/.test(key)){
      inputDigit(key);
      btn = document.querySelector('[data-digit="' + key + '"]');
    } else if (key === '.'){
      inputDecimal();
      btn = document.querySelector('[data-action="decimal"]');
    } else if (key === '+' || key === '-' || key === '*' || key === '/'){
      var opMap = { '+':'+', '-':'−', '*':'×', '/':'÷' };
      chooseOperator(opMap[key]);
      btn = document.querySelector('[data-op="' + opMap[key] + '"]');
    } else if (key === 'Enter' || key === '='){
      e.preventDefault();
      equals();
      btn = document.querySelector('[data-action="equals"]');
    } else if (key === 'Backspace'){
      backspace();
      btn = document.querySelector('[data-action="clear"]');
    } else if (key === 'Escape'){
      clearAll();
      btn = document.querySelector('[data-action="clear"]');
    } else if (key === '%'){
      toPercent();
      btn = document.querySelector('[data-action="percent"]');
    } else {
      return;
    }
    render();
    if (btn){
      btn.classList.add('pressed');
      setTimeout(function(){ btn.classList.remove('pressed'); }, 90);
    }
  });

  render();

  if ('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js');
    });
  }
})();
</script>
</body>
</html>
