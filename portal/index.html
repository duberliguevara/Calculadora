<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi cuenta de Streaming</title>
<meta name="description" content="Regístrate, revisa tu estado y paga tu acceso a streaming.">
<meta name="theme-color" content="#7c3aed">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">
  <div class="card" id="login-card">
    <h1>Mi cuenta de Streaming</h1>
    <p class="sub">Inicia sesión para ver tu estado o suscribirte.</p>
    <button id="google-btn" class="btn full">Continuar con Google</button>

    <div class="divider"><span>o con tu correo</span></div>

    <form id="email-auth-form">
      <div class="field">
        <label for="auth-email">Correo</label>
        <input id="auth-email" type="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="auth-password">Contraseña</label>
        <input id="auth-password" type="password" required autocomplete="current-password" minlength="6">
      </div>
      <div class="auth-buttons">
        <button type="submit" id="email-login-btn" class="btn secondary">Iniciar sesión</button>
        <button type="button" id="email-signup-btn" class="btn">Crear cuenta</button>
      </div>
      <button type="button" id="forgot-password-btn" class="link-btn">¿Olvidaste tu contraseña?</button>
    </form>

    <div id="login-error" class="error-text"></div>
    <div id="setup-warning" class="setup-warning hidden"></div>
  </div>

  <div class="card hidden" id="account-card">
    <div class="account-header">
      <span id="user-name"></span>
      <button id="logout-btn" class="btn secondary small">Salir</button>
    </div>

    <div id="account-error" class="error-text"></div>

    <div id="status-block" class="hidden">
      <div class="status-plan" id="status-plan"></div>
      <span class="badge" id="status-badge"></span>
      <p class="muted" id="status-venc"></p>

      <div id="credentials-box" class="credentials-box hidden">
        <span class="credentials-label">Tus datos de acceso</span>
        <div class="credentials-row">
          <span id="credentials-value" class="credentials-value"></span>
          <button type="button" id="credentials-copy" class="btn secondary small">Copiar</button>
        </div>
        <span id="credentials-copied" class="credentials-copied"></span>
      </div>

      <div id="access-grid" class="access-grid hidden"></div>

      <div id="paywall" class="paywall hidden">
        <p><strong>Tu acceso está pausado.</strong> Ponte al día para volver a ver tus plataformas.</p>
      </div>

      <button id="renew-btn" class="btn full">Renovar / pagar ahora</button>
    </div>

    <form id="signup-form" class="hidden">
      <h2>Elige tu plan</h2>
      <div class="field">
        <label for="field-nombre">Tu nombre</label>
        <input id="field-nombre" type="text" required>
      </div>
      <div class="field">
        <label for="field-contacto">WhatsApp o email de contacto</label>
        <input id="field-contacto" type="text" required>
      </div>
      <div class="field">
        <label for="field-plan">Plan</label>
        <select id="field-plan" required></select>
      </div>
      <div id="plan-preview" class="plan-preview"></div>
      <button type="submit" class="btn full" id="pay-btn">Pagar con Mercado Pago</button>
      <div id="signup-error" class="error-text"></div>
    </form>
  </div>

  <div id="return-banner" class="banner hidden"></div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
