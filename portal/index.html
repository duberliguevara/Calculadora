<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi cuenta de Streaming</title>
<meta name="description" content="Regístrate, revisa tu estado y paga tu acceso a streaming.">
<meta name="theme-color" content="#7c3aed">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">
  <div class="card" id="login-card">
    <h1>Mi cuenta de Streaming</h1>
    <p class="sub">Inicia sesión con tu cuenta de Google para ver tu estado o suscribirte.</p>
    <button id="google-btn" class="btn full">Continuar con Google</button>
    <div id="login-error" class="error-text"></div>
    <div id="setup-warning" class="setup-warning hidden"></div>
  </div>

  <div class="card hidden" id="account-card">
    <div class="account-header">
      <span id="user-name"></span>
      <button id="logout-btn" class="btn secondary small">Salir</button>
    </div>

    <div id="status-block" class="hidden">
      <div class="status-plan" id="status-plan"></div>
      <span class="badge" id="status-badge"></span>
      <p class="muted" id="status-venc"></p>

      <div id="access-grid" class="access-grid hidden"></div>

      <div id="paywall" class="paywall hidden">
        <p><strong>Tu acceso está pausado.</strong> Ponte al día para volver a ver tus plataformas.</p>
      </div>

      <button id="renew-btn" class="btn full">Renovar / pagar ahora</button>
    </div>

    <form id="signup-form" class="hidden">
      <h2>Elige tu plan</h2>
      <div class="field">
        <label for="field-nombre">Tu nombre</label>
        <input id="field-nombre" type="text" required>
      </div>
      <div class="field">
        <label for="field-contacto">WhatsApp o email de contacto</label>
        <input id="field-contacto" type="text" required>
      </div>
      <div class="field">
        <label for="field-plan">Plan</label>
        <select id="field-plan" required></select>
      </div>
      <div id="plan-preview" class="plan-preview"></div>
      <button type="submit" class="btn full" id="pay-btn">Pagar con Mercado Pago</button>
      <div id="signup-error" class="error-text"></div>
    </form>
  </div>

  <div id="return-banner" class="banner hidden"></div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
